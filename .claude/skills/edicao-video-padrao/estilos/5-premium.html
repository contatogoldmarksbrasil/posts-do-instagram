<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0806;font-family:'Montserrat',sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1a1109 0%,#0d0907 55%,#070503 100%)}
.layer{position:absolute;inset:0}
#scene{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 44%}
#world{position:absolute;inset:0;transform-style:preserve-3d}
#grain{opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#vig{background:radial-gradient(115% 80% at 50% 44%,transparent 46%,rgba(0,0,0,.8) 100%)}
#logo{position:absolute;top:60px;left:50%;width:300px;transform:translateX(-50%);opacity:.4;z-index:6}
#bar{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#C9742B,#E8C078);box-shadow:0 0 18px rgba(232,160,74,.7);z-index:6}
.card{position:absolute;left:50%;top:50%;width:820px;padding:70px 66px;border-radius:40px;
 background:linear-gradient(150deg,rgba(38,27,16,.82),rgba(20,14,9,.78));
 border:1.5px solid rgba(255,206,138,.16);box-shadow:0 50px 130px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,170,.08);
 text-align:center;backdrop-filter:blur(3px)}
.line{font-size:64px;font-weight:600;line-height:1.3;color:#F6EEE2;letter-spacing:-.5px}
.acc{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#E8B46A;font-size:1.12em}
.ghost{position:absolute;left:50%;top:50%;width:760px;height:360px;border-radius:40px;background:linear-gradient(150deg,rgba(40,28,16,.5),rgba(18,12,8,.5));border:1.5px solid rgba(255,206,138,.08)}
.amber{background:linear-gradient(135deg,#E8A24A,#C9742B)!important;border:none!important}
.amber .line{color:#1a1008}
.pill{display:inline-flex;align-items:center;gap:22px;padding:34px 60px;border-radius:80px;background:linear-gradient(135deg,#E8C078,#C9742B);color:#1a1008;font-weight:800;font-size:46px;line-height:1.12;box-shadow:0 24px 70px rgba(201,116,43,.5)}
</style></head>
<body>
<div id="stage">
  <canvas class="layer" id="bok" width="1080" height="1920"></canvas>
  <div id="scene"><div id="world"></div></div>
  <div class="layer" id="grain"></div>
  <div class="layer" id="vig"></div>
  <img id="logo" src="logo.png">
  <div id="bar"></div>
</div>
<script>
let TL=null,SCN=null,BOUND=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=t=>1-Math.pow(1-t,3);
const lerp=(a,b,t)=>a+(b-a)*t;
const ACC={1:"marca",2:"reputação.",3:"escolher",4:"sua.",5:"primeiro",6:"tudo.",7:"exclusivo",8:["dez","anos,"],9:"protegida.",};
const blobs=[{x:360,y:560,r:620,c:[232,150,70],ph:0},{x:760,y:900,r:560,c:[201,116,43],ph:2},
 {x:540,y:1300,r:680,c:[217,179,90],ph:4},{x:300,y:1150,r:420,c:[232,170,90],ph:1}];
const dots=[];(function(){let s=7;const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
 for(let i=0;i<26;i++)dots.push({a:r(),b:r(),r:6+r()*26,sp:0.2+r()*0.6});})();

function setTimeline(tl){TL=tl;SCN=tl.scenes;BOUND=[];const n=SCN.length;
 for(let i=0;i<n;i++){const s=i===0?0:(SCN[i-1].end+SCN[i].start)/2;const e=i===n-1?tl.total:(SCN[i].end+SCN[i+1].start)/2;BOUND.push({start:s,end:e});}}

function bokeh(t){const x=document.getElementById("bok").getContext("2d");x.clearRect(0,0,1080,1920);
 for(const b of blobs){const cx=b.x+Math.sin(t*0.25+b.ph)*70,cy=b.y+Math.cos(t*0.2+b.ph)*60;
  const g=x.createRadialGradient(cx,cy,0,cx,cy,b.r);const[r,gr,bl]=b.c;
  g.addColorStop(0,`rgba(${r},${gr},${bl},0.30)`);g.addColorStop(.5,`rgba(${r},${gr},${bl},0.08)`);g.addColorStop(1,`rgba(${r},${gr},${bl},0)`);
  x.fillStyle=g;x.fillRect(0,0,1080,1920);}
 x.save();
 for(const d of dots){const px=((d.a*1140)+t*18*d.sp)%1180-50;const py=((d.b*2000)+Math.sin(t*0.4+d.a*9)*60)%2020-50;
  x.globalAlpha=0.10+0.10*Math.sin(t*0.8+d.a*7);x.shadowBlur=40;x.shadowColor="rgba(232,180,110,0.9)";
  x.fillStyle="rgba(232,190,120,0.5)";x.beginPath();x.arc(px,py,d.r,0,7);x.fill();}
 x.restore();}

function lineHTML(s){let acc=ACC[s.i];const set=new Set(Array.isArray(acc)?acc:[acc]);
 return s.text.replace(/\s+/g,' ').trim().split(' ').map(w=>set.has(w)?'<span class="acc">'+w+'</span>':w).join(' ');}

function cardInner(s){
 if(s.i===10)return '<img src="logo.png" style="width:640px;display:block;margin:0 auto">';
 if(s.i===11)return '<div class="line" style="font-size:42px;color:#C9a06a;font-weight:700;margin-bottom:0">Gold Marks Brasil</div>';
 return '<div class="line">'+lineHTML(s)+'</div>';}

window.seek=function(t){if(!TL)return;bokeh(t);
 document.getElementById("bar").style.width=(1080*clamp(t/TL.total))+"px";
 let html="";
 for(let k=0;k<SCN.length;k++){const s=SCN[k],b=BOUND[k];
  const fin=clamp((t-b.start)/0.4),fout=clamp((b.end-t)/0.4),env=Math.min(fin,fout);
  if(env<=0.01)continue;const lt=t-b.start;const ap=eOut(clamp(lt/0.6));
  const ty=(1-ap)*70+Math.sin(lt*0.8)*7;const rx=Math.sin(lt*0.5)*1.6,ry=Math.cos(lt*0.6)*1.8;
  const sc=lerp(0.93,1,ap);const amber=(s.i===6||s.i===9)?' amber':'';
  // cards fantasma de profundidade
  let ghosts='<div class="ghost" style="transform:translate(-50%,-54%) translateZ(-260px) rotate(-3deg);opacity:'+(env*0.5)+';filter:blur(6px)"></div>'+
             '<div class="ghost" style="transform:translate(-48%,-46%) translateZ(-160px) rotate(2deg);opacity:'+(env*0.6)+';filter:blur(3px)"></div>';
  html+=ghosts+'<div class="card'+amber+'" style="opacity:'+env.toFixed(3)+';transform:translate(-50%,-50%) translateY('+ty.toFixed(1)+'px) translateZ(0) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) scale('+sc.toFixed(3)+')">'+(s.i===11?'<div style="display:flex;flex-direction:column;align-items:center;gap:30px">'+cardInner(s)+'<div class="pill">Fale com um de nossos especialistas <span style="font-size:52px">→</span></div></div>':cardInner(s))+'</div>';}
 document.getElementById("world").innerHTML=html;};
window.__ready=true;
</script></body></html>
